[tool.poetry]
name = "hansard-scraper"
version = "0.1.0"
description = ""
authors = ["roycehoe <hansard@fancybinary.sg>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.5"
sqlmodel = "^0.0.24"
psycopg2 = "^2.9.10"
pre-commit = "^4.3.0"
html2text = "^2025.4.15"
beautifulsoup4 = "^4.13.5"
pydantic-settings = "^2.14.1"
loguru = "^0.7.3"
httpx = "^0.28.1"
alembic = "^1.13"


[tool.poetry.group.dev.dependencies]
ruff = "^0.12.10"
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
select = [
    "I", "F",
    "ANN",
    "RET504", "RET505", "RET506", "RET507", "RET508",
    "BLE001",
    "PLR2004",
    "T201", "T203",
    "DTZ003", "DTZ005",
    "PLW0603",
]
ignore = ["ANN204"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
